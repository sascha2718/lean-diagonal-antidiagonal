fidelity:
  divergences: >-
    The alphabet is a finite type ι with an orientation o : ι → ZMod 2 in place of the labelling
    {1, ..., N}; the alphabet of Σ_Z is ι × ZMod 2. The plane is ℝ × ℝ with the supremum norm,
    and pointwise dimensions use its closed balls. Where the paper speaks of the unique
    s-equilibrium state, the audited statements hold for every shift-invariant s-equilibrium
    state. Theorem A is stated with the printed notion of a double-dimensional measure
    (IsDoubleDim): the pointwise dimension exists almost everywhere and takes exactly two values,
    each on a set of positive measure. Theorem B is stated with its three conditions as a
    disjunction and its furthermore clause as a second conjunct; case (iii) uses Rapaport's
    theorem, proved in BoxLike/Rapaport/, so no headline result takes a literature hypothesis.
    Theorem 4.16 is stated as exact-dimensionality of the projected equilibrium state with
    dimension min{2, dimaff(X)}. Every cited theorem the main line uses is a theorem of the
    library (see sources). Challenge.lean has one sorry per audited theorem; comparator-config.json
    declares no definition_names.

review:
  status: "self-assessed"
  reviewers:
    - "Sascha Troscheit"  # TODO(authors): list the authors who assessed the formalisation.
  notes: >-
    The entry assessments are made with Claude Opus 5.5 agents in Claude Code, followed by Lean
    builds; no LaTeX is changed. Scope and proof deviations are recorded in
    docs/correspondence.md. There is no independent human review. The comparator checks that the
    Solution proofs agree with Challenge from the permitted axioms; it does not check fidelity to
    the paper or to the cited sources.
  # TODO(authors): record any manual review of Challenge.lean and of the literature hypotheses
  # against the paper and the sources.

alignment:
  namespace: "Challenge"
  statements:
    - source: "Theorem A (thm:main1)"
      lean: "Challenge.audit_main1"
      module: "Challenge"
      status: "literature-dependency"
      note: >-
        Full parameter range, from System.main1_dimaff_all: below the threshold the marginal is
        the sum of two nonzero exact-dimensional Gibbs projections of distinct dimensions, hence
        double-dimensional (Lemma 4.1); from the threshold on it is exact-dimensional of dimension
        one; below two by the Gibbs decomposition, from two on by the orientation lift of
        Theorem 4.4. No literature input.
    - source: "Theorem B (thm:main2)"
      lean: "Challenge.audit_main2"
      module: "Challenge"
      status: "literature-dependency"
      note: >-
        Full parameter range, from System.main2_full_of_library and
        System.main2_furthermore_of_library: cases (i) and (ii) along the proof of the manuscript
        (System.main2_prose); case (iii) from Rapaport's theorem, taken as the hypothesis
        RapaportDiagonalDimension and applied to the homogeneous diagonal subsystems
        (System.main2_pesc); the furthermore clause from Theorem 4.16 (System.main_extended_min).
        Literature input: RapaportDiagonalDimension, in case (iii) only.
    - source: "Theorem 4.16 (thm:main_extended)"
      lean: "Challenge.audit_main_extended"
      module: "Challenge"
      status: "literature-dependency"
      note: >-
        Full parameter range, from System.main_extended_min. No literature input.

