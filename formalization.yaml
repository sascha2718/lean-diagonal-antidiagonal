fidelity:
  divergences: >-
    The Lean statements are the manuscript's statements with these differences. The alphabet is
    a finite type ι with an orientation o : ι → ZMod 2, where o i = 0 marks a diagonal and
    o i = 1 an anti-diagonal generator, in place of the labelling of the generators by
    {1, ..., N}; the alphabet {1, ..., 2N} of the sub-shift Σ_Z is ι × ZMod 2. The plane is
    ℝ × ℝ with the supremum norm, and pointwise dimensions of measures use its closed balls.
    Where the paper speaks of the unique s-equilibrium state, the audited statements hold for
    every shift-invariant s-equilibrium state and assume neither uniqueness nor ergodicity.
    Theorem 4.16 is stated as exact-dimensionality of the projected equilibrium state with
    dimension min{2, dimaff(X)}. The seven cited theorems of the headline results are Prop-valued
    definitions, restated in Challenge.lean, and the audited theorems take them as hypotheses and
    are proved conditionally on them. Each quantifies over every
    finite alphabet and every box-like system, carries the hypotheses of the cited theorem and
    is stated about defined objects only. Their statements reduce the sources as follows: the
    sources work on the one-sided shift; Morris–Shmerkin's theorem applies to the transposed
    tuple; Fraser–Jordan–Jurga's non-negative entries become moduli, and three of the four
    decompositions follow from the symmetry exchanging the axes; Feng–Käenmäki's proposition
    applies for 1 < s < 2 to a rescaled tuple with q = 2 - s; Feng's set Σ' lies inside the
    box-like Σ' of the paper, with almost everywhere equal conditional measures; Kittle–Kogler's
    theorem is taken in the form with the Shannon entropy of the weights, which the source
    identifies with the random walk entropy in the absence of exact overlaps. The audited theorems
    use Proposition 3.10 only through its Gibbs bounds. Off the main line, Fraser's
    Theorem 2.3 bounds the upper Minkowski dimension, as the manuscript states. The library
    declares no axiom. Challenge.lean contains one sorry per audited theorem. Solution.lean
    supplies the three complete headline proofs; comparator-config.json declares no
    definition_names, so no
    part of the statement vocabulary is left open for the solution to instantiate.

review:
  status: "self-assessed"
  reviewers:
    - "Sascha Troscheit"  # TODO(authors): list the authors who assessed the formalisation.
  notes: >-
    The numbered-entry source assessments are made with Codex and with Claude Opus 5.5 agents
    in Claude Code, followed by Lean builds; no LaTeX is changed. Exact scope and proof
    deviations are recorded in docs/review.json. There is no independent human review of the
    Lean development. The comparator checks that the Solution proofs of the three headlines
    agree with Challenge from the permitted axioms, and passes in a local run without the Linux
    sandbox. It does not check that these statements, or the literature hypotheses
    they take, are faithful formalisations of the paper and of the cited sources; the doc
    comments of the literature modules, docs/correspondence.md and paper-correspondence.yaml record that
    correspondence.
  # TODO(authors): record any manual review of Challenge.lean and of the literature hypotheses
  # against the paper and the sources.

alignment:
  namespace: "Challenge"
  statements:
    - source: "Theorem 1.2 (thm:main1)"
      lean: "Challenge.audit_main1"
      module: "Challenge"
      status: "literature-dependency"
      note: >-
        Full parameter range, from System.main1_dimaff_all: below two by the Gibbs
        decomposition, from two on by the orientation lift of Theorem 4.4. Its four explicit
        literature inputs are MorrisShmerkinLyapunov, FengKaenmakiGibbs,
        FraserJordanJurgaDecomposition and JordanRapaportDimension; for s >= 2 only
        JordanRapaportDimension is used.
    - source: "Theorem 1.3 (thm:main2)"
      lean: "Challenge.audit_main2"
      module: "Challenge"
      status: "literature-dependency"
      note: >-
        Full parameter range, from System.main2_prose, along the proof of the manuscript, with
        the Shannon–McMillan–Breiman theorem proved in the library. Its five explicit literature
        inputs are MorrisShmerkinLyapunov, FengKaenmakiGibbs, FraserJordanJurgaDecomposition,
        FengLedrappierYoung and KittleKoglerDimension.
    - source: "Theorem 4.16 (thm:main_extended)"
      lean: "Challenge.audit_main_extended"
      module: "Challenge"
      status: "literature-dependency"
      note: >-
        Full parameter range, from System.main_extended_min. Its six explicit literature inputs
        are MorrisShmerkinLyapunov, FengKaenmakiGibbs, FraserJordanJurgaDecomposition,
        JordanRapaportDimension, FengLedrappierYoung and FengLedrappierYoungBar; Feng's
        information-sum identity enters as the theorems fengInfoSum_holds and
        fengInfoSumBar_holds. The s>=2 branch uses none of these inputs.

