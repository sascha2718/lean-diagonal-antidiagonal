status:
  scope: >-
    Formalised and audited: the seven theorems listed in comparator-config.json. They are Theorem 1.2
    (for s = dimaff(X) < 2 the coordinate projections of the s-equilibrium state are
    double-dimensional, fail to be exact-dimensional precisely when s < 2 - λ_1/λ_2, and are
    exact-dimensional of dimension one at and above this threshold), Theorem 4.4 (for 0 < s < 2
    the upper packing and lower Hausdorff dimensions of these projections), Theorem 1.3
    (dim_H X = dimaff(X) when dimaff(X) < 2 and either dimaff(X) ≤ 2 - λ_1/λ_2 or the strong
    open set condition holds), Theorem 4.16 (the projected equilibrium state is
    exact-dimensional of dimension min{2, dimaff(X)}) with its case s ≥ 2 as a separate
    statement, and the formula dim_H X = min{2, dimaff(X)} of Section 4.1 under the hypotheses
    of Theorem 4.16, with its case dimaff(X) ≥ 2 under the strong open set condition as a
    separate statement. The audited statements take as hypotheses eight theorems that the paper
    cites without proof, stated as Prop-valued definitions and restated in Challenge.lean:
    Morris–Shmerkin, Theorem 3.1; Feng–Käenmäki, Proposition 1.2, the Gibbs bounds;
    Fraser–Jordan–Jurga, Lemma 1.3 and Corollaries 1.5 and 1.6; Jordan–Rapaport, Theorem 1.1;
    and Feng, Lemma 4.6 and Theorems 1.2 and 1.3, each for the plane and for the projective
    system. Theorems 1.2 and 4.4 take the first four, Theorems 1.3 and 4.16 and the dimension
    formula take all eight, and the cases s ≥ 2 and dimaff(X) ≥ 2 take none. The headline
    results are therefore proved conditionally on these cited theorems. Beyond these endpoints
    the library machine-checks every other labelled lemma and proposition of the paper except
    the cited Propositions 3.10 and 3.13, whose content enters as hypotheses, and Lemma 3.6. It
    also proves Falconer's upper bound, the existence of equilibrium states for every s ≥ 0,
    their uniqueness and ergodicity for s ≥ 2, Example 4.5 and the chain
    dim_H X = dim_P X = dim_M X = dimaff(X) of the introduction. Theorem 1.1, Proposition 2.7,
    the uniqueness part of Proposition 3.10 and the double-dimensionality of the projections
    without separation rest on further cited theorems taken as hypotheses (Fraser;
    Bárány–Käenmäki; Feng–Käenmäki; Feng–Hu). Not formalised: Lemma 3.6, which the paper uses
    only for the identity h_0(μ) = h(μ), proved directly; the explicit Lyapunov exponents and
    the numerical values of Example 4.5; Question 1.4. paper-correspondence.yaml assesses all 40 numbered statements of the manuscript.
