# Provenance metadata for the Lean formalisation accompanying
# "Hausdorff dimension of planar box-like self-affine sets with rotations" (Allen, Käenmäki,
# Prokaj, Simon and Troscheit, arXiv:XXXX.XXXXX).
# Follows the mathlib-initiative formalization.yaml v0.4 self-reporting format.
# TODO(authors): replace the placeholder arXiv:XXXX.XXXXX throughout once the paper is posted.

version: "v0.4"

project:
  name: "Hausdorff dimension of planar box-like self-affine sets with rotations: Lean formalisation"
  description: >-
    Lean formalisation and source review of the manuscript, with an entry for every numbered
    statement in Solution.lean. Challenge.lean contains only the three headline results
    (Theorems 1.2, 1.3 and 4.16), their explicit literature hypotheses and the 46 definitions
    their statements need. All three are proved for their full ranges. Every numbered statement
    is formalised or cited, except Question 1.4, which is open, and no result rests on an
    unauthorised premise; docs/correspondence.md records every entry.
  authors:
    - "Sascha Troscheit"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Sascha Troscheit"  # TODO(authors): confirm.

classification:
  arxiv: ["math.DS", "math.MG", "math.CA"]  # TODO(authors): match the categories of the arXiv submission.
  msc2020: ["28A80", "37C45", "37D35", "68V20"]  # TODO(authors): the paper gives 28A80, 37C45, 37D35; confirm 68V20.

sources:
  - title: "Hausdorff dimension of planar box-like self-affine sets with rotations"
    authors:
      - "Demi Allen"
      - "Antti Käenmäki"
      - "R. Dániel Prokaj"
      - "Károly Simon"
      - "Sascha Troscheit"
    type: "paper"
    id: "arXiv:XXXX.XXXXX"  # TODO(authors): the arXiv identifier.
    location: "Theorems 1.2, 1.3, 4.4 and 4.16; Section 4.1"
    relationship: "formalizes"
    note: >-
      The paper whose main results are formalised here. Theorem numbers in this file refer to
      the manuscript diagonal-antidiagonal.tex. paper-correspondence.yaml records, with a fingerprint of the LaTeX source of every numbered statement, the
      statement-by-statement correspondence with the Lean declarations, for the static check
      described in the README. No novelty is claimed here beyond what the paper itself claims.
      The three headline results are proved for their full ranges; docs/correspondence.md records
      every entry with its literature inputs.
    license: ""  # TODO(authors): the licence under which the paper is posted.
    author_endorsement: "participated"  # TODO(authors): confirm.
  - title: "On equality of Hausdorff and affinity dimensions, via self-affine measures on positive subsystems"
    authors:
      - "Ian D. Morris"
      - "Pablo Shmerkin"
    type: "article"
    id: "doi:10.1090/tran/7334"
    location: "Trans. Amer. Math. Soc. 371 (2019), Theorem 3.1 and Lemmas 3.4 and 3.5 (numbering of arXiv:1602.08789v3)"
    relationship: "independently-proves"
    note: >-
      Proved, with no literature input. Stated as the Prop-valued definition
      MorrisShmerkinLyapunov (BoxLike/Literature.lean): for a box-like system with rotations, a
      proximal diagonal generator and 0 < s < 2, every s-equilibrium state has distinct Lyapunov
      exponents. The library proves it (morrisShmerkinLyapunov_holds, BoxLike/MorrisShmerkin.lean)
      along Lemmas 3.4 and 3.5: an equilibrium state with equal exponents is Bernoulli, by Gibbs'
      inequality, and a measure with the Gibbs bounds is not; the Gibbs bounds of the equilibrium
      state are equilibriumGibbs. The conclusion holds for every proximal box-like tuple with
      rotations, with no proximal diagonal generator. The library statements that take it as a
      hypothesis receive this proof in Solution; no audited theorem takes it.
  - title: "Equilibrium states of the pressure function for products of matrices"
    authors:
      - "De-Jun Feng"
      - "Antti Käenmäki"
    type: "article"
    id: "doi:10.3934/dcds.2011.30.699"
    location: "Discrete Contin. Dyn. Syst. 30 (2011), Proposition 1.2"
    relationship: "independently-proves"
    note: >-
      Proved, with no literature input. The statement in the form of the source, for every
      irreducible tuple of invertible planar matrices and the norm potential on the one-sided
      shift, is FengKaenmakiNormEquilibrium (BoxLike/LiteratureFengKaenmaki.lean), authorised by
      the project owner; the library proves it (fengKaenmakiNormEquilibrium_holds,
      BoxLike/QuasiMultiplicative/): the norm of an irreducible tuple is quasi-multiplicative
      with connecting words of length at most one, Bowen's construction with periodic-orbit
      measures gives an ergodic Gibbs measure of the norm potential, and every invariant
      equilibrium state equals it by a bound on the relative entropy of the cylinder partitions;
      the natural extension transfers this to the one-sided shift. Its box-like specialisations
      for 0 < s < 2, FengKaenmakiGibbs (BoxLike/Literature.lean), the Gibbs bounds of
      Proposition 3.10, and FengKaenmakiUnique (BoxLike/LiteratureRemarks.lean), uniqueness of
      the s-equilibrium state, apply the source to the rescaled tuple
      |det A_i|^((s-1)/(2-s)) A_i with q = 2 - s for 1 < s < 2, and hold
      (fengKaenmakiGibbs_holds, fengKaenmakiUnique_holds). The library statements of
      Proposition 3.10 for irreducible tuples (MatrixTuple.irred_eq_state_of_fengKaenmaki,
      System.irred_eq_state) take these statements as hypotheses and receive the proofs in
      Solution. For box-like tuples with rotations, irreducible or not, which include the tuples
      of the main results, the library proves Proposition 3.10 with no literature input
      (System.irred_eq_state_of_withRotations, BoxLike/EquilibriumGibbs.lean): for 0 < s < 2
      every invariant s-equilibrium state equals the image of Bowen's ergodic Gibbs measure
      under forgetting the orientation, by a bound on the relative entropy of the cylinder
      partitions. The audited theorems take the Gibbs bounds in this form,
      EquilibriumGibbsStatement, which Solution discharges with equilibriumGibbs; no audited
      theorem takes a Feng–Käenmäki predicate.
  - title: "Dimensions of equilibrium measures on a class of planar self-affine sets"
    authors:
      - "Jonathan M. Fraser"
      - "Thomas Jordan"
      - "Natalia Jurga"
    type: "article"
    id: "doi:10.4171/jfg/85"
    location: "J. Fractal Geom. 7 (2020), Lemma 1.3 and Corollaries 1.5 and 1.6"
    relationship: "independently-proves"
    note: >-
      Proved, with no literature input. Stated as FraserJordanJurgaDecomposition
      (BoxLike/Literature.lean): the decomposition of Proposition 3.14 of an invariant measure
      with the Gibbs bounds into the push-forwards of two ergodic Gibbs measures on the sub-shift
      of finite type, with the Lyapunov identities. The library proves it
      (fraserJordanJurgaDecomposition_holds, BoxLike/FraserJordanJurga/): Bowen's theorem
      (bowenGibbsExistence, BoxLike/Bowen/) gives the ergodic Gibbs measure of the first
      potential on the mixing sub-shift, its image under the exchange of the axes is the second;
      the image of the first under forgetting the axis has the Gibbs bounds, and every invariant
      measure with these bounds equals it; the four decompositions follow from the partition of
      the sub-shift into the ranges of the two codings, and the Lyapunov identities from
      Birkhoff's theorem along the two lifts and a relative-entropy comparison. Neither
      proximality nor a separation condition is used. The library statements that take it as a
      hypothesis receive this proof in Solution; no audited theorem takes it.
  - title: "Dimension of ergodic measures projected onto self-similar sets with overlaps"
    authors:
      - "Thomas Jordan"
      - "Ariel Rapaport"
    type: "article"
    id: "doi:10.1112/plms.12337"
    location: "Proc. Lond. Math. Soc. (3) 122 (2021), Theorem 1.1 (numbering of arXiv:1908.00271)"
    relationship: "other"
    note: >-
      Stated as JordanRapaportDimension (BoxLike/Literature.lean): under the projective
      exponential separation condition, which is their exponential separation for the
      projective system, the projection of an ergodic measure on the sub-shift is
      exact-dimensional with the entropy-to-exponent ratio, capped at one, as its dimension.
      The library proves it (jordanRapaportDimension_of_shmerkin, BoxLike/JordanRapaport.lean)
      along Section 2 of the source from Shmerkin's theorem on the L^q dimension of self-similar
      measures, ShmerkinLqDimension, itself a theorem of the library. The library statements of
      the audited Theorems 1.2 and 4.16, of Theorem 4.4 and of the dimension formula take it as a
      hypothesis, and Solution discharges it; the proof of Theorem 1.3 does not use it.
  - title: "On Furstenberg's intersection conjecture, self-similar measures, and the L^q norms of convolutions"
    authors:
      - "Pablo Shmerkin"
    type: "article"
    id: "arXiv:1609.07802"
    location: "Ann. of Math. (2) 189 (2019), Theorem 6.6 (numbering of arXiv:1609.07802v3)"
    relationship: "other"
    note: >-
      Stated as ShmerkinLqDimension (BoxLike/Literature.lean), authorised on 2026-10-21: for a
      finite IFS of contracting similarities of the line with his exponential separation
      (Definition 6.5, ShmerkinExpSeparation) and the self-similar measure of a positive
      probability vector, the lower bound of Theorem 6.6 on the L^q dimension, in the form of his
      Definition 1.6: for q > 1 and α < 1 with ∑ p_j^q |r_j|^{-(q-1)α} < 1 the sum of μ(I)^q over
      any finite family of dyadic intervals of level M is at most 2^{-M(q-1)α} for all large M.
      The library proves it (shmerkinLqDimension_holds, BoxLike/Shmerkin.lean) along the source:
      Sections 4 and 6.4, Theorem 5.1 from the inverse theorem for L^q norms of convolutions
      (Theorem 2.1), and Theorem 2.1 along Section 3 from the asymmetric Balog–Szemerédi–Gowers
      theorem (Theorem 3.2, proved after B. Green's notes) and a weak form of Bourgain's structure
      theorem (Theorem 3.1) with some positive doubling exponent in place of 2^{-2T-1}, proved
      from Hochman's saturation theorem of the vendored library ExactOverlaps along Shmerkin,
      arXiv:2308.09846, Theorem 1.5; the weak form suffices because the exponent of Theorem 3.2
      is chosen after the block length. The input of Jordan–Rapaport's proof; the library
      statements behind the audited Theorems 1.2 and 4.16, Theorem 4.4 and the dimension formula
      take it as a hypothesis and Solution passes the proof.
  - title: "Dimension of invariant measures for affine iterated function systems"
    authors:
      - "De-Jun Feng"
    type: "article"
    id: "doi:10.1215/00127094-2022-0014"
    location: "Duke Math. J. 172 (2023), Lemma 4.6 and Theorems 1.2 and 1.3 (numbering of arXiv:1901.01691v2)"
    relationship: "other"
    note: >-
      Theorems 1.2 (ii) and 1.3 are proved in the plane, in the form PlanarFengLedrappierYoung
      (BoxLike/LiteraturePlanarFeng.lean), the Ledrappier–Young formula for every planar
      self-affine system with simple Lyapunov spectrum (planarFengLedrappierYoung_holds,
      BoxLike/FengLedrappierYoung.lean), along Feng's Sections 4 to 6: the claims (C1) to (C3)
      by general theorems about nested measurable partitions, Proposition 5.1 from the planar
      form of Lemma 5.4, and Proposition 5.5 by Besicovitch differentiation on the atoms and the
      weak maximal inequality. Its box-like specialisation FengLedrappierYoung
      (BoxLike/LiteratureFeng.lean, fengLedrappierYoung_holds) is taken as a hypothesis by the
      library statements of the audited Theorems 1.3 and 4.16 and of the dimension formula, and
      Solution discharges it. The formula for the projective system, FengLedrappierYoungBar,
      follows from it through the planar system z ↦ diag(g'_j, g'_j / 2) z + (g_j(0), 0) of the
      projective system (fengLedrappierYoungBar_of_fengLedrappierYoung,
      BoxLike/ProjectiveLineSystem.lean; fengLedrappierYoungBar_holds) and is a hypothesis of
      no audited theorem. Lemma 4.6, first identity of
      (4.16), is proved along Feng's Lemmas 4.4 and 4.5: the Prop-valued definitions FengInfoSum
      and FengInfoSumBar hold (fengInfoSum_holds, fengInfoSumBar_holds) and are hypotheses of no
      audited theorem; so are his (4.17) (thm:feng_entropy_kolmogorov_sinai) and the planar
      identity.
  - title: "The exact overlaps conjecture for self-similar measures on the real line"
    authors:
      - "Samuel Kittle"
      - "Constantin Kogler"
    type: "preprint"
    id: "arXiv:2610.10511"
    location: "arXiv:2610.10511 (7 October 2026), Theorem 1.1"
    relationship: "other"
    note: >-
      Stated as KittleKoglerDimension (BoxLike/Literature.lean) and proved
      (kittleKoglerDimension_holds, BoxLike/KittleKogler.lean) from the authors' Lean
      formalisation of the source, the library ExactOverlaps carried verbatim in vendor/
      (github.com/ckkogler/exact-overlaps-one-dim-lean, commit 99c43ade): a self-similar
      measure on the line for finitely many contracting similarities with positive weights whose
      maps generate a free semigroup is exact-dimensional of dimension min{1, H(p)/|χ|}. The
      source states the theorem with the random walk entropy, which its formalisation
      identifies with H(p) in the absence of exact overlaps. The library statements behind the
      audited Theorem 1.3 take it as a hypothesis and Solution passes the proof; it is a
      hypothesis of no audited theorem.
  - title: "Dimension theory of iterated function systems"
    authors:
      - "De-Jun Feng"
      - "Huyi Hu"
    type: "article"
    id: "doi:10.1002/cpa.20276"
    location: "Comm. Pure Appl. Math. 62 (2009), Theorem 2.8"
    relationship: "other"
    note: >-
      Stated as FengHuExactDim (BoxLike/LiteratureRemarks.lean) and proved
      (fengHuExactDim_holds, BoxLike/FengHu.lean) along Feng–Hu's density argument, with the
      deterministic estimates of the library ExactOverlaps: exact-dimensionality of the
      projections of ergodic measures under the projective system, without separation. It
      enters only the remark that the coordinate projections of the equilibrium state are
      double-dimensional without separation; no audited theorem takes it.
  - title: "On the packing dimension of box-like self-affine sets in the plane"
    authors:
      - "Jonathan M. Fraser"
    type: "article"
    id: "doi:10.1088/0951-7715/25/7/2075"
    location: "Nonlinearity 25 (2012), Theorem 2.3 and Corollary 2.5 (numbering of arXiv:1108.2639v1)"
    relationship: "independently-proves"
    note: >-
      Proved, with no literature input. Theorem 2.3 is stated as System.FraserBound and
      System.FraserROSC (BoxLike/FraserChain.lean), which give Theorem 1.1 of the paper, and the
      library proves both along Fraser's Section 5 (System.fraserBound_holds,
      System.fraserROSC_holds, BoxLike/Fraser/): the upper bound from his Lemma 5.1 (1) and the
      cover by the copies of the stopping words, the lower bound under the rectangular open set
      condition from his Lemma 5.1 (2) and an area count for the disjoint rectangles. In the
      super-multiplicative case of Lemma 5.1 (2) a block sum takes the place of Fraser's k-block
      stopping set, which need not be prefix-free. Corollary 2.5 is derived from the second
      part. The squeeze dimmaff(X) = dimaff(X) in the introduction takes System.FraserBound and
      receives this proof in Solution. No audited theorem takes them.
  - title: "Super-exponential condensation without exact overlaps"
    authors:
      - "Balázs Bárány"
      - "Antti Käenmäki"
    type: "article"
    id: "arXiv:1910.04623"
    location: "Adv. Math. 379 (2021), Theorem 2.1 (numbering of arXiv:1910.04623v4)"
    relationship: "other"
    note: >-
      Stated as NoOverlap.BaranyKaenmakiTheorem, Theorem 2.1 as the source states it, and as
      NoOverlap.BaranyKaenmakiPair, the form the proof of Proposition 2.7 uses
      (BoxLike/NoOverlapExample.lean). The library proves the second (baranyKaenmakiPair_holds,
      BoxLike/BaranyKaenmaki.lean, a Baire category argument) and refutes the first
      (not_baranyKaenmakiTheorem, BoxLike/BaranyKaenmakiCounterexample.lean): Theorem 2.1 as
      stated is false, and its proof gives the bound with a constant. Proposition 2.7 is proved
      with no literature hypothesis; no audited theorem takes these statements.
  - title: "Local dimensions of measures on infinitely generated self-affine sets"
    authors:
      - "Eino Rossi"
    type: "article"
    id: "doi:10.1016/j.jmaa.2013.12.030"
    location: "J. Math. Anal. Appl. 413 (2014), Theorem 2.2"
    relationship: "independently-proves"
    note: >-
      Proved, with no literature input. Stated as System.RossiBound
      (BoxLike/DimensionFormula.lean) for every box-like system and every ergodic measure, and
      proved by a covering argument (System.rossiBound, BoxLike/RossiBound.lean,
      BoxLike/Rossi.lean): the Shannon–McMillan–Breiman theorem and the Furstenberg–Kesten limits
      along the forward products bound the typical words and the rectangles containing their
      copies of X, and the mass distribution principle bounds the lower pointwise dimension.
      Taken by no theorem: the proof of Theorem 4.16 evaluates the Ledrappier–Young formula to an
      equality. Equality in the bound for the equilibrium state of Theorem 4.16 is proved.
  - title: "The Hausdorff dimension of self-affine fractals"
    authors:
      - "K. J. Falconer"
    type: "article"
    id: "doi:10.1017/S0305004100064926"
    location: "Math. Proc. Cambridge Philos. Soc. 103 (1988), cited in the paper as Theorem 5.4"  # TODO(authors): check the theorem number against the source.
    relationship: "independently-proves"
    note: >-
      The upper bound min{2, dimaff(X)} for the upper Minkowski dimension, and with it for the
      Hausdorff dimension, is proved for every planar self-affine set by the Euclidean ellipse
      cover (PlanarSystem.upperBoxDim_attractor_le, PlanarSystem.dimH_attractor_le), and for every
      box-like self-affine set also by a covering in the supremum metric
      (System.upperBoxDim_attractor_le, System.dimH_attractor_le).

