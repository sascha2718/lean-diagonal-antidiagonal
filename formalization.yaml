# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
# Provenance metadata for the Lean formalisation accompanying
# "Hausdorff dimension of planar box-like self-affine sets with rotations" (Käenmäki, Prokaj,
# Simon and Troscheit, arXiv:XXXX.XXXXX).
# Follows the mathlib-initiative formalization.yaml v0.4 self-reporting format.
# TODO(authors): replace the placeholder arXiv:XXXX.XXXXX throughout once the paper is posted.

version: "v0.4"

project:
  name: "Hausdorff dimension of planar box-like self-affine sets with rotations: Lean formalisation"
  description: >-
    Lean formalisation of the manuscript, with an entry for every numbered statement in
    Solution.lean. Challenge.lean states the three headline results (Theorems A, B and 4.16) over
    Mathlib with the 42 definitions their statements need; all three are proved for their full
    ranges with no literature hypothesis. Every numbered statement is formalised, including
    Rapaport's theorem (Theorem 1.2 of the paper, proved in BoxLike/Rapaport/), except the cited
    theorem of Hochman–Rapaport (Theorem 1.1), recorded as a Prop-valued statement that is not
    proved and used nowhere, and Question 1.4, which is open.
  authors:
    - "Sascha Troscheit"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Sascha Troscheit"  # TODO(authors): confirm.

classification:
  arxiv: ["math.DS", "math.MG", "math.CA"]  # TODO(authors): match the categories of the arXiv submission.
  msc2020: ["28A80", "37C45", "37D35", "68V20"]  # TODO(authors): the paper gives 28A80, 37C45, 37D35; confirm 68V20.

sources:
  - title: "Hausdorff dimension of planar box-like self-affine sets with rotations"
    authors:
      - "Antti Käenmäki"
      - "R. Dániel Prokaj"
      - "Károly Simon"
      - "Sascha Troscheit"
    type: "paper"
    id: "arXiv:XXXX.XXXXX"  # TODO(authors): the arXiv identifier.
    location: "Theorems A, B, 4.4 and 4.16; Section 4.1"
    relationship: "formalizes"
    note: >-
      The paper whose results are formalised here. paper-correspondence.yaml maps every numbered
      statement, with a fingerprint of its LaTeX source, to the Lean declarations.
    license: ""  # TODO(authors): the licence under which the paper is posted.
    author_endorsement: "participated"  # TODO(authors): confirm.
  - title: "Dimension of diagonal self-affine sets and measures via non-conformal partitions"
    authors:
      - "Ariel Rapaport"
    type: "preprint"
    id: "arXiv:2309.03985"
    location: "arXiv:2309.03985v1, Theorem 1.3 (Theorem 1.2 of the paper)"
    relationship: "other"
    note: >-
      Theorem 1.3 in the plane as the Prop-valued statement RapaportDiagonalDimension
      (BoxLike/LiteratureRapaport.lean): for a box-like system with diagonal linear parts,
      proximal, whose induced systems on both coordinate axes are exponentially separated,
      dim_H X = min{2, dimaff(X)}. Proved as Rapaport.rapaportDiagonalDimension_holds in
      BoxLike/Rapaport/ along Sections 2 to 7 of the source, with the vendored Kittle-Kogler
      central limit theorem in place of Berry-Esseen (docs/correspondence.md).
      Used by case (iii) of Theorem B. No deviation in the hypotheses or the conclusion.
  - title: "Hausdorff dimension of planar self-affine sets and measures with overlaps"
    authors:
      - "Michael Hochman"
      - "Ariel Rapaport"
    type: "article"
    id: "doi:10.4171/jems/1127"
    location: "J. Eur. Math. Soc. 24 (2022), Theorem 1.1 (numbering of arXiv:1904.09812v2; Theorem 1.1 of the paper)"
    relationship: "other"
    note: >-
      Theorem 1.1 as the Prop-valued statement HochmanRapaportDimension
      (BoxLike/LiteratureHochmanRapaport.lean): proximal, strongly irreducible, no common fixed
      point, exponentially separated. Not proved; no result of the library uses it. Deviations
      from the source: the distance of the affine coefficients (PlanarSystem.affDist) in place of
      a left-invariant Riemannian metric, comparable along words of length n up to factors
      exponential in n, so the same condition with another constant; the bound c^n along
      infinitely many n in place of every n, the weaker form the source allows; proximal strongly
      irreducible, the paper's phrasing, in place of non-conformal and totally irreducible, so the
      statement is a consequence of the source's theorem.
  - title: "On equality of Hausdorff and affinity dimensions, via self-affine measures on positive subsystems"
    authors:
      - "Ian D. Morris"
      - "Pablo Shmerkin"
    type: "article"
    id: "doi:10.1090/tran/7334"
    location: "Trans. Amer. Math. Soc. 371 (2019), Theorem 3.1 and Lemmas 3.4 and 3.5 (numbering of arXiv:1602.08789v3)"
    relationship: "independently-proves"
    note: >-
      Theorem 3.1 as MorrisShmerkinLyapunov (BoxLike/Literature.lean), proved along Lemmas 3.4 and
      3.5 (morrisShmerkinLyapunov_holds).
  - title: "Equilibrium states of the pressure function for products of matrices"
    authors:
      - "De-Jun Feng"
      - "Antti Käenmäki"
    type: "article"
    id: "doi:10.3934/dcds.2011.30.699"
    location: "Discrete Contin. Dyn. Syst. 30 (2011), Proposition 1.2"
    relationship: "independently-proves"
    note: >-
      Proposition 1.2 in the form of the source as FengKaenmakiNormEquilibrium
      (BoxLike/LiteratureFengKaenmaki.lean), proved (fengKaenmakiNormEquilibrium_holds,
      BoxLike/QuasiMultiplicative/); its box-like specialisations FengKaenmakiGibbs and
      FengKaenmakiUnique follow. For tuples with rotations Proposition 3.10 is proved outright
      (System.irred_eq_state_of_withRotations, equilibriumGibbs).
  - title: "Dimensions of equilibrium measures on a class of planar self-affine sets"
    authors:
      - "Jonathan M. Fraser"
      - "Thomas Jordan"
      - "Natalia Jurga"
    type: "article"
    id: "doi:10.4171/jfg/85"
    location: "J. Fractal Geom. 7 (2020), Lemma 1.3 and Corollaries 1.5 and 1.6"
    relationship: "independently-proves"
    note: >-
      Lemma 1.3 and Corollaries 1.5 and 1.6 as FraserJordanJurgaDecomposition
      (BoxLike/Literature.lean), proved from Bowen's theorem
      (fraserJordanJurgaDecomposition_holds, BoxLike/FraserJordanJurga/).
  - title: "Dimension of ergodic measures projected onto self-similar sets with overlaps"
    authors:
      - "Thomas Jordan"
      - "Ariel Rapaport"
    type: "article"
    id: "doi:10.1112/plms.12337"
    location: "Proc. Lond. Math. Soc. (3) 122 (2021), Theorem 1.1 (numbering of arXiv:1908.00271)"
    relationship: "other"
    note: >-
      Theorem 1.1 as JordanRapaportDimension (BoxLike/Literature.lean), proved along Section 2 of
      the source from Shmerkin's theorem (jordanRapaportDimension_of_shmerkin,
      BoxLike/JordanRapaport.lean).
  - title: "On Furstenberg's intersection conjecture, self-similar measures, and the L^q norms of convolutions"
    authors:
      - "Pablo Shmerkin"
    type: "article"
    id: "arXiv:1609.07802"
    location: "Ann. of Math. (2) 189 (2019), Theorem 6.6 (numbering of arXiv:1609.07802v3)"
    relationship: "other"
    note: >-
      The lower bound of Theorem 6.6 as ShmerkinLqDimension (BoxLike/Literature.lean), proved
      along the source (shmerkinLqDimension_holds, BoxLike/Shmerkin/), with Theorem 3.2 after B.
      Green's notes and Bourgain's Theorem 3.1 in a weak form from Hochman's saturation theorem of
      the vendored library ExactOverlaps.
  - title: "Dimension of invariant measures for affine iterated function systems"
    authors:
      - "De-Jun Feng"
    type: "article"
    id: "doi:10.1215/00127094-2022-0014"
    location: "Duke Math. J. 172 (2023), Lemma 4.6 and Theorems 1.2 and 1.3 (numbering of arXiv:1901.01691v2)"
    relationship: "other"
    note: >-
      Theorems 1.2 (ii) and 1.3 in the plane as PlanarFengLedrappierYoung
      (BoxLike/LiteraturePlanarFeng.lean), proved along Sections 4 to 6
      (planarFengLedrappierYoung_holds, BoxLike/FengLedrappierYoung.lean); the box-like forms
      FengLedrappierYoung and FengLedrappierYoungBar follow. Lemma 4.6 as FengInfoSum and
      FengInfoSumBar, proved (fengInfoSum_holds, fengInfoSumBar_holds).
  - title: "The exact overlaps conjecture for self-similar measures on the real line"
    authors:
      - "Samuel Kittle"
      - "Constantin Kogler"
    type: "preprint"
    id: "arXiv:2610.10511"
    location: "arXiv:2610.10511 (7 October 2026), Theorem 1.1"
    relationship: "other"
    note: >-
      Theorem 1.1 as KittleKoglerDimension (BoxLike/Literature.lean), proved from the authors'
      Lean formalisation of the source, the library ExactOverlaps carried verbatim in vendor/
      (kittleKoglerDimension_holds, BoxLike/KittleKogler.lean).
  - title: "Dimension theory of iterated function systems"
    authors:
      - "De-Jun Feng"
      - "Huyi Hu"
    type: "article"
    id: "doi:10.1002/cpa.20276"
    location: "Comm. Pure Appl. Math. 62 (2009), Theorem 2.8"
    relationship: "other"
    note: >-
      Theorem 2.8 as FengHuExactDim (BoxLike/LiteratureRemarks.lean), proved along Feng–Hu's
      density argument (fengHuExactDim_holds, BoxLike/FengHu.lean). Used only in a remark.
  - title: "On the packing dimension of box-like self-affine sets in the plane"
    authors:
      - "Jonathan M. Fraser"
    type: "article"
    id: "doi:10.1088/0951-7715/25/7/2075"
    location: "Nonlinearity 25 (2012), Theorem 2.3 and Corollary 2.5 (numbering of arXiv:1108.2639v1)"
    relationship: "independently-proves"
    note: >-
      Theorem 2.3 as System.FraserBound and System.FraserROSC (BoxLike/FraserChain.lean), proved
      along Section 5 (System.fraserBound_holds, System.fraserROSC_holds, BoxLike/Fraser/);
      Corollary 2.5 follows.
  - title: "Super-exponential condensation without exact overlaps"
    authors:
      - "Balázs Bárány"
      - "Antti Käenmäki"
    type: "article"
    id: "arXiv:1910.04623"
    location: "Adv. Math. 379 (2021), Theorem 2.1 (numbering of arXiv:1910.04623v4)"
    relationship: "other"
    note: >-
      Theorem 2.1 as stated (NoOverlap.BaranyKaenmakiTheorem) is false (not_baranyKaenmakiTheorem,
      BoxLike/BaranyKaenmakiCounterexample.lean). The form the proof of Proposition 2.7 uses,
      NoOverlap.BaranyKaenmakiPair, is proved by a Baire category argument
      (baranyKaenmakiPair_holds, BoxLike/BaranyKaenmaki.lean).
  - title: "Local dimensions of measures on infinitely generated self-affine sets"
    authors:
      - "Eino Rossi"
    type: "article"
    id: "doi:10.1016/j.jmaa.2013.12.030"
    location: "J. Math. Anal. Appl. 413 (2014), Theorem 2.2"
    relationship: "independently-proves"
    note: >-
      Theorem 2.2 as System.RossiBound (BoxLike/DimensionFormula.lean), proved by a covering
      argument (System.rossiBound). No theorem takes it.
  - title: "The Hausdorff dimension of self-affine fractals"
    authors:
      - "K. J. Falconer"
    type: "article"
    id: "doi:10.1017/S0305004100064926"
    location: "Math. Proc. Cambridge Philos. Soc. 103 (1988), cited in the paper as Theorem 5.4"  # TODO(authors): check the theorem number against the source.
    relationship: "independently-proves"
    note: >-
      The bound min{2, dimaff(X)} for the upper Minkowski and Hausdorff dimensions, proved for
      every planar self-affine set (PlanarSystem.dimH_attractor_le) and every box-like set
      (System.dimH_attractor_le).

