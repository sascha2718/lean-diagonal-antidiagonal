status:
  scope: >-
    All 44 numbered statements are recorded: 42 are formalised, Theorem 1.1 is cited and unused,
    and Question 1.4 is open. The three headline results cover their full parameter ranges
    without unproved literature assumptions. Counts exclude the intentional Challenge holes.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]
  main_results:
    - declaration: "Challenge.audit_main1"
      file: "Solution.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator-config.json"
      literature_dependencies: []
    - declaration: "Challenge.audit_main2"
      file: "Solution.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator-config.json"
      literature_dependencies: []
    - declaration: "Challenge.audit_main_extended"
      file: "Solution.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator-config.json"
      literature_dependencies: []

automation:
  methods:
    - method: "agent"
      models: ["Claude Opus 5.5 (claude-opus-5-5, Anthropic)"]
      framework: "Claude Code (Anthropic)"
      tool_setup: "Lean proof development with a coordinator integrating task-specific workers."
      cost:
        wall_time: "not tracked"  # TODO(authors): confirm.
        spend_usd: "subscription-based"  # TODO(authors): confirm.
        hardware: "local machine"
    - method: "manual"
      tool_setup: "Mathematical direction and review of the paper and formal statements."
  spend_usd: "not tracked"  # TODO(authors): confirm.
  notes: >-
    LLMs were used extensively for Lean formalisation. In the paper, they assisted language
    editing, occasional prose drafting from the authors' descriptions, and reference searches
    and checks. Mathematical drafting, routine details and checks were limited to the s >= 2
    arguments in Lemma 3.12 and Theorems 4.4 and 4.16, Proposition 2.7, Remark 4.17 and Example
    4.5, using the authors' own ideas and proof strategies.

fidelity:
  divergences: >-
    Lean uses a finite type for the alphabet, ZMod 2 for orientations, and supremum-norm closed
    balls in the plane. The headline statements apply to every invariant equilibrium state.
    Scope and proof differences are recorded in docs/correspondence.md.

review:
  status: "self-assessed"
  reviewers: ["Antti Käenmäki", "R. Dániel Prokaj", "Károly Simon", "Sascha Troscheit"]
  notes: >-
    The authors checked the formal statements and their dependent definitions against the paper,
    every paper argument themselves, and every reference against its source. They take full
    responsibility for the paper. Comparator checks agreement between Challenge and Solution;
    correspondence with the paper is assessed by the authors.

alignment:
  namespace: "Challenge"
  statements:
    - source: "Theorem A (thm:main1)"
      lean: "Challenge.audit_main1"
      module: "Challenge"
      status: "formalized"
    - source: "Theorem B (thm:main2)"
      lean: "Challenge.audit_main2"
      module: "Challenge"
      status: "formalized"
    - source: "Theorem 4.16 (thm:main_extended)"
      lean: "Challenge.audit_main_extended"
      module: "Challenge"
      status: "formalized"

acknowledgements: "Lean 4, Mathlib, Comparator, and the Anthropic models listed under automation."
