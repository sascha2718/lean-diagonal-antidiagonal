fidelity:
  divergences: >-
    The Lean statements are the manuscript's statements with these differences. The alphabet is
    a finite type ι with an orientation o : ι → ZMod 2, where o i = 0 marks a diagonal and
    o i = 1 an anti-diagonal generator, in place of the labelling of the generators by
    {1, ..., N}; the alphabet {1, ..., 2N} of the sub-shift Σ_Z is ι × ZMod 2. The plane is
    ℝ × ℝ with the supremum norm, and pointwise dimensions of measures use its closed balls.
    Where the paper speaks of the unique s-equilibrium state, the audited statements hold for
    every shift-invariant s-equilibrium state and assume neither uniqueness nor ergodicity.
    Theorem 4.16 is stated as exact-dimensionality of the projected equilibrium state with
    dimension min{2, dimaff(X)}. The four cited theorems of the headline results are Prop-valued
    definitions, restated in Challenge.lean, and the audited theorems take them as hypotheses and
    are proved conditionally on them. Each quantifies over every finite alphabet and every
    box-like system, carries the hypotheses of the cited theorem and is stated about defined
    objects only. Their statements reduce the sources as follows: the sources work on the
    one-sided shift; Feng's set Σ' lies inside the box-like Σ' of the paper, with almost
    everywhere equal conditional measures; Kittle–Kogler's theorem is taken in the form with the
    Shannon entropy of the weights, which the source identifies with the random walk entropy in
    the absence of exact overlaps. The audited theorems use Proposition 3.10 only through its
    Gibbs bounds, which the library proves for box-like tuples with rotations (equilibriumGibbs),
    and the library proves the distinct Lyapunov exponents that the manuscript takes from
    Morris–Shmerkin (morrisShmerkinLyapunov_holds). Proposition 3.14 of Fraser–Jordan–Jurga is
    proved in the library (fraserJordanJurgaDecomposition_holds). Off the main line, Fraser's
    Theorem 2.3 bounds the upper Minkowski dimension, as the manuscript states, and the library
    proves it (System.fraserBound_holds, System.fraserROSC_holds), as it proves Feng–Käenmäki's
    Proposition 1.2 for irreducible planar tuples (fengKaenmakiNormEquilibrium_holds) and
    Rossi's bound (System.rossiBound). The library
    declares no axiom. Challenge.lean contains one sorry per audited theorem. Solution.lean
    supplies the three complete headline proofs; comparator-config.json declares no
    definition_names, so no
    part of the statement vocabulary is left open for the solution to instantiate.

review:
  status: "self-assessed"
  reviewers:
    - "Sascha Troscheit"  # TODO(authors): list the authors who assessed the formalisation.
  notes: >-
    The numbered-entry source assessments are made with Codex and with Claude Opus 5.5 agents
    in Claude Code, followed by Lean builds; no LaTeX is changed. Exact scope and proof
    deviations are recorded in docs/review.json. There is no independent human review of the
    Lean development. The comparator checks that the Solution proofs of the three headlines
    agree with Challenge from the permitted axioms, and passes in a local run without the Linux
    sandbox. It does not check that these statements, or the literature hypotheses
    they take, are faithful formalisations of the paper and of the cited sources; the doc
    comments of the literature modules, docs/correspondence.md and paper-correspondence.yaml record that
    correspondence.
  # TODO(authors): record any manual review of Challenge.lean and of the literature hypotheses
  # against the paper and the sources.

alignment:
  namespace: "Challenge"
  statements:
    - source: "Theorem 1.2 (thm:main1)"
      lean: "Challenge.audit_main1"
      module: "Challenge"
      status: "literature-dependency"
      note: >-
        Full parameter range, from System.main1_dimaff_all: below two by the Gibbs
        decomposition, from two on by the orientation lift of Theorem 4.4. Its one explicit
        literature input is JordanRapaportDimension. The distinct Lyapunov exponents, the Gibbs
        bounds of the equilibrium state and the Gibbs decomposition are the theorems
        morrisShmerkinLyapunov_holds, equilibriumGibbs and fraserJordanJurgaDecomposition_holds.
    - source: "Theorem 1.3 (thm:main2)"
      lean: "Challenge.audit_main2"
      module: "Challenge"
      status: "literature-dependency"
      note: >-
        Full parameter range, from System.main2_prose, along the proof of the manuscript, with
        the Shannon–McMillan–Breiman theorem and the Gibbs decomposition
        (fraserJordanJurgaDecomposition_holds) proved in the library, and so are the distinct
        Lyapunov exponents and the Gibbs bounds of the equilibrium state
        (morrisShmerkinLyapunov_holds, equilibriumGibbs). Its two explicit literature inputs are
        FengLedrappierYoung and KittleKoglerDimension.
    - source: "Theorem 4.16 (thm:main_extended)"
      lean: "Challenge.audit_main_extended"
      module: "Challenge"
      status: "literature-dependency"
      note: >-
        Full parameter range, from System.main_extended_min. Its two explicit literature inputs
        are JordanRapaportDimension and FengLedrappierYoung; the distinct Lyapunov exponents, the
        Gibbs bounds of the equilibrium state, Feng's information-sum identity, the Gibbs
        decomposition and Feng's scalar Ledrappier–Young formula enter as the theorems
        morrisShmerkinLyapunov_holds, equilibriumGibbs, fengInfoSum_holds, fengInfoSumBar_holds,
        fraserJordanJurgaDecomposition_holds and fengLedrappierYoungBar_of_fengLedrappierYoung.
        The s>=2 branch uses none of these inputs.

