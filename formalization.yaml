# Provenance metadata for the Lean formalisation accompanying
# "Hausdorff dimension of planar box-like self-affine sets with rotations" (Allen, Käenmäki,
# Prokaj, Simon and Troscheit, arXiv:XXXX.XXXXX).
# Follows the mathlib-initiative formalization.yaml v0.4 self-reporting format.
# TODO(authors): replace the placeholder arXiv:XXXX.XXXXX throughout once the paper is posted.

version: "v0.4"

project:
  name: "Hausdorff dimension of planar box-like self-affine sets with rotations: Lean formalisation"
  description: >-
    Lean 4 formalisation of the main results of the paper "Hausdorff dimension of planar
    box-like self-affine sets with rotations" by Demi Allen, Antti Käenmäki, R. Dániel Prokaj,
    Károly Simon and Sascha Troscheit (arXiv:XXXX.XXXXX). For a proximal planar box-like
    self-affine set X with rotations satisfying the projective exponential separation
    condition, the audited statements are: the coordinate projections of the equilibrium state
    at the affinity dimension are double-dimensional, and exact-dimensional precisely at and
    above an explicit threshold (Theorem 1.2); the upper packing and lower Hausdorff dimensions
    of these projections (Theorem 4.4); dim_H X = dimaff(X) at or below the threshold or under
    the strong open set condition (Theorem 1.3); the projected equilibrium state is
    exact-dimensional of dimension min{2, dimaff(X)} (Theorem 4.16), with its case s ≥ 2; and
    dim_H X = min{2, dimaff(X)}, with its case dimaff(X) ≥ 2. The statements are made in
    Challenge.lean over Mathlib alone and discharged by Solution.lean from the library BoxLike.
    Eight theorems that the paper cites without proof are hypotheses of the audited statements.
  authors:
    - "Sascha Troscheit"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Sascha Troscheit"  # TODO(authors): confirm.

classification:
  arxiv: ["math.DS", "math.MG", "math.CA"]  # TODO(authors): match the categories of the arXiv submission.
  msc2020: ["28A80", "37C45", "37D35", "68V20"]  # TODO(authors): the paper gives 28A80, 37C45, 37D35; confirm 68V20.

sources:
  - title: "Hausdorff dimension of planar box-like self-affine sets with rotations"
    authors:
      - "Demi Allen"
      - "Antti Käenmäki"
      - "R. Dániel Prokaj"
      - "Károly Simon"
      - "Sascha Troscheit"
    type: "paper"
    id: "arXiv:XXXX.XXXXX"  # TODO(authors): the arXiv identifier.
    location: "Theorems 1.2, 1.3, 4.4 and 4.16; Section 4.1"
    relationship: "formalizes"
    note: >-
      The paper whose main results are formalised here. Theorem numbers in this file refer to
      the manuscript diagonal-antidiagonal.tex. paper-correspondence.yaml records, with a fingerprint of the LaTeX source of every numbered statement, the
      statement-by-statement correspondence with the Lean declarations, for the static check
      described in the README. No novelty is claimed here beyond what the paper itself claims.
    license: ""  # TODO(authors): the licence under which the paper is posted.
    author_endorsement: "participated"  # TODO(authors): confirm.
  - title: "On equality of Hausdorff and affinity dimensions, via self-affine measures on positive subsystems"
    authors:
      - "Ian D. Morris"
      - "Pablo Shmerkin"
    type: "article"
    id: "doi:10.1090/tran/7334"
    location: "Trans. Amer. Math. Soc. 371 (2019), Theorem 3.1 (numbering of arXiv:1602.08789v3)"
    relationship: "other"
    note: >-
      Assumed, not proved. Stated as the Prop-valued definition MorrisShmerkinLyapunov
      (BoxLike/Literature.lean): for a box-like system with rotations, a proximal diagonal
      generator and 0 < s < 2, every s-equilibrium state has distinct Lyapunov exponents. A
      hypothesis of the audited Theorems 1.2, 1.3, 4.4 and 4.16 and of the dimension formula.
  - title: "Equilibrium states of the pressure function for products of matrices"
    authors:
      - "De-Jun Feng"
      - "Antti Käenmäki"
    type: "article"
    id: "doi:10.3934/dcds.2011.30.699"
    location: "Discrete Contin. Dyn. Syst. 30 (2011), Proposition 1.2"
    relationship: "other"
    note: >-
      Assumed, not proved. Stated for irreducible box-like systems and 0 < s < 2 as two
      Prop-valued definitions: FengKaenmakiGibbs (BoxLike/Literature.lean), the Gibbs bounds of
      Proposition 3.10, a hypothesis of the audited Theorems 1.2, 1.3, 4.4 and 4.16 and of the
      dimension formula; and FengKaenmakiUnique (BoxLike/LiteratureRemarks.lean), uniqueness of
      the s-equilibrium state, which no audited theorem takes. For 1 < s < 2 both apply the
      source to the rescaled tuple |det A_i|^((s-1)/(2-s)) A_i with q = 2 - s.
  - title: "Dimensions of equilibrium measures on a class of planar self-affine sets"
    authors:
      - "Jonathan M. Fraser"
      - "Thomas Jordan"
      - "Natalia Jurga"
    type: "article"
    id: "doi:10.4171/jfg/85"
    location: "J. Fractal Geom. 7 (2020), Lemma 1.3 and Corollaries 1.5 and 1.6"
    relationship: "other"
    note: >-
      Assumed, not proved. Stated as FraserJordanJurgaDecomposition (BoxLike/Literature.lean):
      the decomposition of Proposition 3.13 of an invariant measure with the Gibbs bounds into
      the push-forwards of two ergodic Gibbs measures on the sub-shift of finite type, including
      the existence of these Gibbs measures. No separation condition is assumed. A hypothesis of
      the audited Theorems 1.2, 1.3, 4.4 and 4.16 and of the dimension formula.
  - title: "Dimension of ergodic measures projected onto self-similar sets with overlaps"
    authors:
      - "Thomas Jordan"
      - "Ariel Rapaport"
    type: "article"
    id: "doi:10.1112/plms.12337"
    location: "Proc. Lond. Math. Soc. (3) 122 (2021), Theorem 1.1 (numbering of arXiv:1908.00271)"
    relationship: "other"
    note: >-
      Assumed, not proved. Stated as JordanRapaportDimension (BoxLike/Literature.lean): under
      the projective exponential separation condition, which is their exponential separation
      for the projective system, the projection of an ergodic measure on the sub-shift is
      exact-dimensional with the entropy-to-exponent ratio, capped at one, as its dimension. A
      hypothesis of the audited Theorems 1.2, 1.3, 4.4 and 4.16 and of the dimension formula.
  - title: "Dimension of invariant measures for affine iterated function systems"
    authors:
      - "De-Jun Feng"
    type: "article"
    id: "doi:10.1215/00127094-2022-0014"
    location: "Duke Math. J. 172 (2023), Lemma 4.6 and Theorems 1.2 and 1.3 (numbering of arXiv:1901.01691v2)"
    relationship: "other"
    note: >-
      Assumed, not proved. Stated as four Prop-valued definitions (BoxLike/LiteratureFeng.lean):
      FengInfoSum and FengInfoSumBar, the first identity of (4.16) in Lemma 4.6 for the planar
      and the projective partitions; FengLedrappierYoung and FengLedrappierYoungBar, the
      Ledrappier–Young formula of Theorem 4.2 for the plane and for the projective system.
      Hypotheses of the audited Theorems 1.3 and 4.16 and of the dimension formula.
  - title: "Dimension theory of iterated function systems"
    authors:
      - "De-Jun Feng"
      - "Huyi Hu"
    type: "article"
    id: "doi:10.1002/cpa.20276"
    location: "Comm. Pure Appl. Math. 62 (2009), Theorem 2.8"
    relationship: "other"
    note: >-
      Assumed, not proved. Stated as FengHuExactDim (BoxLike/LiteratureRemarks.lean):
      exact-dimensionality of the projections of ergodic measures under the projective system,
      without separation. It enters only the remark that the coordinate projections of the
      equilibrium state are double-dimensional without separation; no audited theorem takes it.
  - title: "On the packing dimension of box-like self-affine sets in the plane"
    authors:
      - "Jonathan M. Fraser"
    type: "article"
    id: "doi:10.1088/0951-7715/25/7/2075"
    location: "Nonlinearity 25 (2012), Theorem 2.3 and Corollary 2.5 (numbering of arXiv:1108.2639v1)"
    relationship: "other"
    note: >-
      Assumed, not proved. Theorem 2.3 is stated as System.FraserBound and System.FraserROSC
      (BoxLike/FraserChain.lean), which give Theorem 1.1 of the paper; Corollary 2.5 is derived
      from them. System.FraserBound is a hypothesis of the squeeze dimmaff(X) = dimaff(X) in the
      introduction. No audited theorem takes them.
  - title: "Super-exponential condensation without exact overlaps"
    authors:
      - "Balázs Bárány"
      - "Antti Käenmäki"
    type: "article"
    id: "arXiv:1910.04623"
    location: "Adv. Math. 379 (2021), Theorem 2.1 (numbering of arXiv:1910.04623v4)"
    relationship: "other"
    note: >-
      Assumed, not proved. Stated as NoOverlap.BaranyKaenmakiTheorem, Theorem 2.1 as the source
      states it, and as NoOverlap.BaranyKaenmakiPair, the form the proof of Proposition 2.7 uses
      (BoxLike/NoOverlapExample.lean). Proposition 2.7 is proved from either; no audited theorem
      takes them.
  - title: "Local dimensions of measures on infinitely generated self-affine sets"
    authors:
      - "Eino Rossi"
    type: "article"
    id: "doi:10.1016/j.jmaa.2013.12.030"
    location: "J. Math. Anal. Appl. 413 (2014), Theorem 2.2"
    relationship: "other"
    note: >-
      Stated as System.RossiBound (BoxLike/DimensionFormula.lean) and taken by no theorem: the
      proof of Theorem 4.16 evaluates the Ledrappier–Young formula to an equality. Equality in
      the bound for the equilibrium state of Theorem 4.16 is proved.
  - title: "The Hausdorff dimension of self-affine fractals"
    authors:
      - "K. J. Falconer"
    type: "article"
    id: "doi:10.1017/S0305004100064926"
    location: "Math. Proc. Cambridge Philos. Soc. 103 (1988), cited in the paper as Theorem 5.4"  # TODO(authors): check the theorem number against the source.
    relationship: "independently-proves"
    note: >-
      The upper bound min{2, dimaff(X)} for the upper Minkowski dimension, and with it for the
      Hausdorff dimension, is proved for every box-like self-affine set by a covering argument
      for box-like maps in the supremum metric (System.upperBoxDim_attractor_le,
      System.dimH_attractor_le).

