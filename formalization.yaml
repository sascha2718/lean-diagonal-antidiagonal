      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator-config.json"
      literature_dependencies: []
    - declaration: "Challenge.audit_main2"
      file: "Solution.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator-config.json"
      literature_dependencies: ["BoxLike.RapaportDiagonalDimension"]
    - declaration: "Challenge.audit_main_extended"
      file: "Solution.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator-config.json"
