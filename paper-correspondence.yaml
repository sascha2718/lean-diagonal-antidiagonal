    status: cited
    hypotheses: ["BoxLike.FengKaenmakiGibbs", "BoxLike.FengKaenmakiUnique"]
    lean: ["BoxLike.System.HasGibbsBounds", "BoxLike.System.exists_isEquilibriumState", "BoxLike.System.unique_equilibrium", "BoxLike.System.existsUnique_isEquilibriumState_of_two_le", "BoxLike.System.IsEquilibriumState.ergodic_of_two_le", "BoxLike.System.ergodic_of_hasProximalDiagonal"]
    relation: split
    headline: false
    note: "Feng–Käenmäki, Proposition 1.2 (Discrete Contin. Dyn. Syst. 30 (2011)), enters for irreducible box-like systems and 0 < s < 2 as two Prop-valued definitions: FengKaenmakiGibbs, the Gibbs bounds, and FengKaenmakiUnique, uniqueness. For 1 < s < 2 both apply the source to the rescaled tuple |det A_i|^((s-1)/(2-s)) A_i with q = 2 - s, since the source concerns the norm potential; one sentence on the rescaling repairs the citation. Existence of an s-equilibrium state is proved for every s ≥ 0 without irreducibility. For s ≥ 2 existence, uniqueness and ergodicity are proved with no literature hypothesis, since the equilibrium state is Bernoulli. For 0 < s < 2 ergodicity is proved from thm:eq_state_is_sum. The main results use only the Gibbs bounds."

