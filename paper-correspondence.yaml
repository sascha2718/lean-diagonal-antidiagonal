  - source: "Projections of the equilibrium state at the affinity dimension"
    label: "thm:main1"
    number: "A"
    kind: "maintheorem"
    sha256: "dc89d8412a780ca29883199bc45aec74269c459455222744bdd03aefbc2eb654"
    status: "formalized"
    lean: ["Challenge.audit_main1"]
    hypotheses: []
    relation: "exact"
    headline: true
    note: "Theorem A as printed: below the threshold 2 - lambda_1/lambda_2 each coordinate projection of pi_*mu is double-dimensional in the sense of sec:ledrappier_young_formula (two distinct values, each on a set of positive measure: IsDoubleDim), and from the threshold on it is exact-dimensional of dimension one. Proved for every invariant s-equilibrium state at s = dimaff(X), for every value of dimaff; uniqueness and ergodicity are not needed as premises. For s >= 2 the exponents coincide, the threshold is one and both values are one (main1_of_two_le), through the Bernoulli orientation lift of Theorem 4.4. For 0 < s < 2 the marginal is the sum of two nonzero exact-dimensional Gibbs projections (eq:proj_eq_is_sum) whose dimensions differ exactly below the threshold, and Lemma 4.1 gives double-dimensionality (main1_isDoubleDim); Jordan-Rapaport is called directly, so Feng-Hu is a redundant citation. The two values are identified in Theorem 4.4 (main1_values_all). The inputs the manuscript takes from Morris-Shmerkin (eq:simple_lyapunov) and Feng-Kaenmaki (the Gibbs bounds) are theorems of the library (morrisShmerkinLyapunov_holds, equilibriumGibbs)."
    solution_entry: "paper_A"
    library: ["BoxLike.System.main1_dimaff_all", "BoxLike.System.main1_dichotomy_all", "BoxLike.System.main1_isDoubleDim", "BoxLike.System.main1_values_all", "BoxLike.System.main1_all", "BoxLike.System.main1_of_two_le", "BoxLike.System.main1", "BoxLike.System.eq_state_proj_dim_all"]
