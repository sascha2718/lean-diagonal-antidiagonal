    note: "Pointwise dimensions use closed balls; on ℝ × ℝ these are balls of the supremum norm. Double-dimensional (IsDoubleDim) is the printed definition: the pointwise dimension exists almost everywhere and takes exactly two values, each on a set of positive measure; HasLocalDimPair is the weaker property that it takes one of two given values almost everywhere, and isDoubleDim_iff_upperPackingDim_lowerHausdorffDim is the characterisation of the paragraph after eq:haus_dim_sum (values udimp and ldimh with ldimh < udimp), for every nonzero measure. Both lines of eq:dimension_measure_def are proved on a finite-dimensional space: the first for every finite Borel measure, the second for μ ≠ 0, as the paper states. With real-valued essential bounds the first needs the upper pointwise dimension essentially bounded, which holds on ℝ^d."
