  - source: "Decomposition of the equilibrium state into two Gibbs measures"
    label: "thm:eq_state_is_sum"
    number: "3.13"
    kind: proposition
    sha256: "bc9d1da8d3977693ff5e553391a59e3894e2ec65111b904fcdb41ca5a2699c90"
    status: cited
    hypotheses: ["BoxLike.FraserJordanJurgaDecomposition"]
    lean: ["BoxLike.System.GibbsDecomposition", "BoxLike.System.pressure_eq_pressureZ₁", "BoxLike.System.pressure_eq_pressureZ₂", "BoxLike.System.GibbsDecomposition.lyapunov₁_eq_integral", "BoxLike.System.GibbsDecomposition.lyapunov₂_eq_integral", "BoxLike.System.GibbsDecomposition.map_flip", "BoxLike.System.decomposition₂_of_decompositions"]
    relation: split
    headline: false
    note: "Fraser–Jordan–Jurga, Lemma 1.3 and Corollaries 1.5 and 1.6 (J. Fractal Geom. 7 (2020)), together with the existence of ergodic Gibbs measures on the mixing sub-shift, enter as FraserJordanJurgaDecomposition: an invariant probability measure with the Gibbs bounds of thm:irred_eq_state is the sum of the push-forwards in each of the four ways, with λ_1(𝖠, μ) = λ̄(𝖠, μ_1) and λ_2(𝖠, μ) = λ̄(𝖠, μ_2). No separation condition is assumed. The remaining assertions are proved: P(𝖠, s) = P_Z(f_{1,s}) = P_Z(f_{2,s}) for every box-like system with a diagonal generator, the integral formulas, μ_2 = flip_*μ_1, and the fourth decomposition from the other three."

