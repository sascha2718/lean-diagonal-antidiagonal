  - source: "Fraser's packing and Minkowski dimension formula"
    label: "thm:fraser"
    number: "1.1"
    kind: theorem
    sha256: "44d7ffc618efed9efb29998f5d790f695f680c0b71d8d25e6c400507f1ccb5ee"
    status: cited
    hypotheses: ["BoxLike.System.FraserBound", "BoxLike.System.FraserROSC"]
    lean: ["BoxLike.System.packingDim_attractor", "BoxLike.System.FraserROSC.dimmaff_eq_dimaff", "BoxLike.System.FraserROSC.dim_eq_dimaff", "BoxLike.System.dimmaff_eq_dimaff_of_full", "BoxLike.System.fraserBound_of_subsingleton", "BoxLike.System.fraserROSC_of_subsingleton"]
    relation: split
    headline: false
    note: "Fraser, Theorem 2.3 (Nonlinearity 25 (2012), arXiv:1108.2639v1), enters as two Prop-valued definitions stated as in the source: System.FraserBound, dim_P X = upper dim_M X ≤ dimmaff(X) for every box-like set, and System.FraserROSC, dim_P X = dim_M X = dimmaff(X) under the rectangular open set condition. The first display of the paper writes dim_M X; without a separation condition the source bounds only the upper Minkowski dimension. The first equality dim_P X = upper dim_M X is proved for every box-like set. The third part, Fraser's Corollary 2.5, is derived from System.FraserROSC, and holds without the rectangular open set condition when dimaff(X) ≤ 2 (System.dimmaff_eq_dimaff_of_full). The source assumes at least two maps; the statements hold for a single map."

  - source: "Projections of the equilibrium state at the affinity dimension"
    label: "thm:main1"
    number: "1.2"
    kind: theorem
    sha256: "2467c19660d2b7ea0f4735fc910d4d6447e18554cedb82699b4dacea9afa937d"
    status: formalized
    lean: ["Challenge.audit_main1"]
    library: ["BoxLike.System.main1_dimaff", "BoxLike.System.main1"]
    hypotheses: ["BoxLike.MorrisShmerkinLyapunov", "BoxLike.FengKaenmakiGibbs", "BoxLike.FraserJordanJurgaDecomposition", "BoxLike.JordanRapaportDimension"]
    relation: exact
    headline: true
    note: "The audited statement, like the library theorem, holds for every shift-invariant s-equilibrium state μ at s = dimaff(X) < 2; uniqueness and ergodicity of μ are not assumed. The two coordinate projections of μ are the marginals System.marginal c μ, c in ZMod 2. The three conjuncts are double-dimensionality, the failure of exact-dimensionality precisely when s < 2 - λ_1/λ_2, and exact dimension one at and above the threshold. System.main1 is the same statement with s a zero of the pressure in (0, 2)."

  - source: "Hausdorff dimension equals affinity dimension"
    label: "thm:main2"
    number: "1.3"
    kind: theorem
    sha256: "b09303115b3712224aad555981a843f55ad4172f0d7e2b236847c97dc6e6e1b8"
    status: formalized
    lean: ["Challenge.audit_main2"]
    library: ["BoxLike.System.main2"]
    hypotheses: ["BoxLike.MorrisShmerkinLyapunov", "BoxLike.FengKaenmakiGibbs", "BoxLike.FraserJordanJurgaDecomposition", "BoxLike.JordanRapaportDimension", "BoxLike.FengInfoSum", "BoxLike.FengInfoSumBar", "BoxLike.FengLedrappierYoung", "BoxLike.FengLedrappierYoungBar"]
    relation: exact
    headline: true
    note: "The audited statement, like the library theorem, holds for every shift-invariant s-equilibrium state μ at s = dimaff(X) < 2, under the alternative dimaff(X) ≤ 2 - λ_1/λ_2 or the strong open set condition. The upper bound dim_H X ≤ dimaff(X) is Falconer's bound, proved for every box-like set (System.dimH_attractor_le); the lower bound is the mass distribution principle for the exact-dimensional measure π_*μ."

  - source: "Question on coincident projection dimensions under strong separation"
    label: "q:coincident-projection-dimensions"
    number: "1.4"
    kind: question
    sha256: "3a1e4bca3a82b4b9685952e495653183b1f9eff45e8e7bb5c5cbc24aec2edb03"
    status: intentionally_unformalized
    headline: false
    reason: "A question is not a statement to prove, and the library records no conjecture. Its objects are those of thm:main1: a system satisfying the strong separation condition and failing projective exponential separation, whose two coordinate marginals might be exact-dimensional of the same positive dimension below the threshold 2 - λ_1/λ_2. prop:ssc_no_overlap_not_pesc shows that the hypotheses are consistent; whether the two dimensions can coincide is open."

  # ---------------------------------------------------------------- Section 2: Preliminaries
  - source: "Box-like matrices are diagonal or anti-diagonal"
    label: "thm:box_like_sa"
    number: "2.1"
    kind: lemma
    sha256: "ea51fe1bdbebe9923cfd1d50397f0cb0ae8500b53a351ed08ad48cebbee715c5"
    status: formalized
    lean: ["BoxLike.IsSquareIsometry", "BoxLike.isSquareIsometry_iff", "BoxLike.IsBoxLikeMatrix", "BoxLike.isBoxLikeMatrix_iff", "BoxLike.IsSquareIsometry.boxMat_zero_mul_orientation"]
    relation: split
    headline: false
    note: "The lemma is formalised for a single matrix: A = DR with D diagonal, ‖D‖ < 1 and R a linear isometry of the square, if and only if A is diagonal or anti-diagonal with nonzero entries in (-1, 1). The forward direction uses only R([-1,1]^2) ⊆ [-1,1]^2. That both types occur is the hypothesis System.WithRotations."

  - source: "Classification of irreducibility for planar tuples"
