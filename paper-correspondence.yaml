    lean: ["BoxLike.System.attractor_sq", "BoxLike.System.sq_withRotations", "BoxLike.System.StrongSeparation.sq", "BoxLike.System.StrongOpenSet.sq", "BoxLike.System.ProjExpSeparation.sq", "BoxLike.group", "BoxLike.System.proj_sq_group", "BoxLike.System.pressure_sq", "BoxLike.entropy_map_group", "BoxLike.System.lyapunov₁_sq_map_group", "BoxLike.System.lyapunov₂_sq_map_group", "BoxLike.System.IsEquilibriumState.map_group", "BoxLike.System.unique_sq_equilibrium"]
    hypotheses: ["BoxLike.FengKaenmakiUnique"]
    relation: split
    headline: false
    note: "μ^(2) is the push-forward of μ under the grouping map group. Its uniqueness for 0 < s < 2 takes FengKaenmakiUnique; its ergodicity follows from thm:eq_state_is_sum. The proximal diagonal generator of the second iterate comes from thm:box_like_proximal."

