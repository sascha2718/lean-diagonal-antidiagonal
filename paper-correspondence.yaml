  - source: "prop:ssc_no_overlap_not_pesc"
    kind: proposition
    status: formalized
    lean: ["BoxLike.NoOverlap.ssc_no_overlap_not_pesc", "BoxLike.NoOverlap.ssc_no_overlap_not_pesc'", "BoxLike.NoOverlap.exists_system_of_homFree", "BoxLike.NoOverlap.exists_pair_of_baranyKaenmakiTheorem", "BoxLike.System.FreeProjective", "BoxLike.NoOverlap.planar_separation_not_pesc"]
    hypotheses: ["BoxLike.NoOverlap.BaranyKaenmakiPair", "BoxLike.NoOverlap.BaranyKaenmakiTheorem"]
    relation: exact
    headline: false
    note: "The proposition is proved in two forms. NoOverlap.ssc_no_overlap_not_pesc takes the input of Bárány–Käenmäki in the form the proof uses, NoOverlap.BaranyKaenmakiPair. NoOverlap.ssc_no_overlap_not_pesc' takes Theorem 2.1 of Bárány–Käenmäki (Adv. Math. 379 (2021), arXiv:1910.04623v4) as the source states it, NoOverlap.BaranyKaenmakiTheorem, applied to η_n = exp(-n^2); neither the transcendence of λ nor the uncountability of the first-coordinate projection is needed. The choice of parameters, the standing hypotheses, strong separation and the freeness of the projective semigroup are proved. Not strongly irreducible is the negation of TupleStronglyIrreducible. NoOverlap.planar_separation_not_pesc is the paragraph after the proof."

