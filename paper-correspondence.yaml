    note: "The introduction derives dim_H X = dim_P X = dim_M X = dimaff(X) from thm:main2, and squeezes dimmaff(X) = dimaff(X). The chain holds for every box-like set with dim_H X = dimaff(X), from Falconer's bound alone (System.dim_chain). The squeeze takes System.FraserBound. The inequality dimmaff(X) ≤ dimaff(X) holds for every box-like set. The forms with suffix main2 add the hypotheses of thm:main2."

