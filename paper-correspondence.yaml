    sha256: "b7080434e4b8e55dbaff9e8293a768308cea499316bc3e94645a37cd616fece8"
    status: formalized
    lean: ["BoxLike.TupleIrreducible", "BoxLike.TupleStronglyIrreducible", "BoxLike.TupleProximal", "BoxLike.tuple_classification", "BoxLike.tuple_trichotomy", "BoxLike.not_tupleIrreducible_iff_simultaneouslyTriangular", "BoxLike.simultaneouslyBoxLike_of_proximal", "BoxLike.simultaneouslyBoxLike_iff", "BoxLike.tupleIrreducible_iff_lines", "BoxLike.tupleStronglyIrreducible_iff_lines", "BoxLike.System.irreducible_and_not_stronglyIrreducible"]
    relation: split
    headline: false
    note: "Stated for planar tuples of invertible matrices over an arbitrary index type, with no literature input. Precisely one of the three conditions holds for every tuple; the second is equivalent to irreducible and not strongly irreducible under proximality, and the third to reducible. Without proximality both directions of the second equivalence fail (not_tupleIrreducible_swap, not_simultaneouslyBoxLike_rotThree). A proximal box-like tuple with rotations lies in the second case (System.irreducible_and_not_stronglyIrreducible)."

