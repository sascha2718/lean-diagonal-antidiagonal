# Correspondence between the manuscript `diagonal-antidiagonal.tex` and the Lean library `BoxLike`.
#
# Every numbered statement of the manuscript (the theorem-like environments share one counter,
# numbered within sections) has one entry, keyed by its label and carrying its printed number.
# Selected unnumbered definitions and claims have entries of kind `prose`, anchored by a start
# and an end phrase that each occur once in the manuscript. Every entry records a sha256
# fingerprint of the TeX tokens of its source span, with comments and layout whitespace
# ignored; `manuscript_sha256` fingerprints the whole file and `manuscript_revision` is the
# commit of the manuscript repository at which the correspondence was last reviewed. The
# fingerprints and the printed numbers detect drift between the manuscript and this file; they
# do not establish mathematical equivalence. `scripts/check_paper_correspondence.py` checks the
# file against the manuscript, the Lean sources, comparator-config.json, formalization.yaml and
# docs/correspondence.md; after a change of the manuscript has been reviewed against the Lean
# side, `--write-fingerprints` records the new fingerprints.
#
# status: `formalized`; `partially_formalized`, with a `reason` naming what is missing; `cited`,
# a theorem the paper quotes from the literature without proof, which enters as the Prop-valued
# definitions listed under `hypotheses`; or `intentionally_unformalized`, with a `reason`.
# relation: how the Lean statements relate to the paper's: `exact`; `split` (several
# declarations carry the parts); `representation` (the same content in the library's
# representation); `specialization`; `generalization`; `stronger`; `partial`.
# lean: the declarations certifying the statement. For a headline entry they are the audited
# theorems of Challenge.lean, and `library` lists the library theorems that Solution.lean
# applies.
# hypotheses: the Prop-valued definitions stating cited theorems that the listed declarations
# take as hypotheses. The library declares no axiom.
# Lean names in notes omit the root namespace `BoxLike`.
version: 3
