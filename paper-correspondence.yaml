    lean: ["BoxLike.lowerLocalDim", "BoxLike.upperLocalDim", "BoxLike.HasLocalDim", "BoxLike.IsExactDim", "BoxLike.IsDoubleDim", "BoxLike.HasLocalDimPair", "BoxLike.IsDoubleDim.not_isExactDim", "BoxLike.isDoubleDim_iff_upperPackingDim_lowerHausdorffDim", "BoxLike.upperPackingDim", "BoxLike.lowerHausdorffDim", "BoxLike.ofReal_upperPackingDim_eq_iInf_packingDim_of_finiteDimensional", "BoxLike.ofReal_lowerHausdorffDim_eq_iInf_dimH_of_finiteDimensional", "BoxLike.upperPackingDim_le_of_absolutelyContinuous"]
