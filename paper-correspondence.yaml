    note: "Theorem B as printed, for every value of dimaff and every invariant equilibrium state (main2_full; Challenge.audit_main2 states the dimension formula under (i) or (ii) or (iii) together with the furthermore clause). Cases (i) and (ii) along the prose (main2_prose): returns to horizontal orientation from ergodicity, not mixing; the scalar Feng formula for the diagonal subsystem from the planar FengLedrappierYoung on an auxiliary system; under (i) or (ii) dimaff <= 2, so min{2, dimaff} = dimaff. Case (iii) along the prose with Rapaport's theorem as the explicit literature hypothesis hrap (main2_pesc): the typical families of the t-equilibrium state give homogeneous diagonal subsystems X_n of X whose induced axis systems are exponentially separated, dim_H X_n = min{2, dimaff(X_n)} by Rapaport, dimaff(X_n) is the right-hand side of eq:diml_min2 and tends to dim_L(A, mu_t) >= t, then t = s or t -> 2. Furthermore clause from thm:main_extended (main2_furthermore). main2_noExactOverlaps_all is an alternative proof of cases (i) and (ii)."
    solution_entry: "paper_B"
