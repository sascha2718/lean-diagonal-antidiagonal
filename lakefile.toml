name = "boxlike"
defaultTargets = ["BoxLike"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "v4.35.0-rc2"

# The glob covers the root module and every submodule.
[[lean_lib]]
name = "BoxLike"
globs = ["BoxLike", "BoxLike.*"]

# Comparator audit modules (not part of the library, not default targets):
# `Challenge` restates the headline theorems with `sorry`, `Solution` proves them
# by the library declarations. See comparator-config.json.
[[lean_lib]]
name = "Challenge"

[[lean_lib]]
name = "Solution"

# Kittle–Kogler, *The exact overlaps conjecture for self-similar measures on the real line*
# (arXiv:2610.10511), formalised in Lean by its authors: a verbatim copy of the library
# `ExactOverlaps` of github.com/ckkogler/exact-overlaps-one-dim-lean, under its own licence, with
# the Lean options of its own lakefile; see vendor/README.md. It supplies the dimension formula
# that proves `BoxLike.KittleKoglerDimension`. `lake build BoxLike` builds the modules the library
# imports; `lake build ExactOverlaps` builds all of them.
[[lean_lib]]
name = "ExactOverlaps"
srcDir = "vendor"
leanOptions = { relaxedAutoImplicit = false, maxSynthPendingDepth = 3 }
